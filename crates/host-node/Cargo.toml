[package]
name = "soundcraft-host-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "One Sound editor window's host side compiled for node (wasm-bindgen), so OneOS can test the assistant's command bridge against the real engine and the files the editor saves"

# No workspace lints: the wasm-bindgen macros expand to code the workspace's `unsafe_code = "forbid"` refuses.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soundcraft-engine = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
